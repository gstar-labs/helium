[package]
name = "helium"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"
members = [".", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
dead_code = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
unused = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints]
workspace = true
